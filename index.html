<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#170d2e">
  <title>Para mi niña 💛</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <main class="scene">
    <p class="eyebrow">Una flor para alguien muy especial</p>
    <h1>Para ti, mi niña <span>✦</span></h1>
    <p class="intro">Hay cosas bonitas que florecen cuando pienso en ti.</p>

    <div class="garden" id="garden">
      <div class="glow"></div>
      <div class="sparkle sparkle-one">✦</div><div class="sparkle sparkle-two">✧</div>
      <div class="water-drop" aria-hidden="true"></div>
      <div class="seed" aria-hidden="true"></div>
      <svg class="flower" viewBox="0 0 500 560" role="img" aria-label="Tulipán con mensajes de amor en varios idiomas">
        <defs>
          <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a8db72"/><stop offset="1" stop-color="#3f9b66"/></linearGradient>
          <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b5e86f"/><stop offset="1" stop-color="#288b65"/></linearGradient>
          <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#ffe66b"/><stop offset=".34" stop-color="#ffb54f"/><stop offset=".68" stop-color="#df72d4"/><stop offset="1" stop-color="#8150dc"/></linearGradient>
          <radialGradient id="heart"><stop stop-color="#fff8b0"/><stop offset=".55" stop-color="#ffc34e"/><stop offset="1" stop-color="#e78336"/></radialGradient>
          <filter id="shine"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <path class="stem" d="M250 280 C248 365 264 430 250 510"/>
        <path class="leaf left-leaf" d="M251 427 C191 385 137 405 155 446 C179 474 224 456 251 427Z"/>
        <path class="leaf right-leaf" d="M253 465 C299 405 354 403 352 443 C342 477 292 481 253 465Z"/>
        <g class="bud"><path d="M250 281 C219 267 222 226 250 204 C278 226 281 267 250 281Z" fill="url(#leaf)"/><path d="M250 272 C236 245 243 220 250 211 C257 220 264 245 250 272Z" fill="url(#petal)"/></g>
        <g id="petals"></g>
        <circle class="flower-core" cx="250" cy="278" r="28"/>
        <g id="stamens"></g>
        <circle class="core-dot" cx="250" cy="278" r="8"/>
      </svg>
      <div class="ground"></div>
    </div>

    <button id="bloomButton" type="button">Haz florecer mi amor <span>✿</span></button>
    <p class="hint" id="hint">Toca el botón y mira cómo florece 🌱</p>
    <p class="final-message" id="finalMessage" aria-live="polite">Te amo, mi niña <span>💛</span></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
